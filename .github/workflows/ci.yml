name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run repository gate
        run: make PYTHON=python check

      - name: Build native audio helper
        run: make PYTHON=python build-native-audio

  distribution:
    name: standalone-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-distribution.lock

      - name: Install locked distribution dependencies
        run: python -m pip install -r requirements-distribution.lock

      - name: Build ad-hoc standalone app
        run: python scripts/build_distribution.py --arch "${{ matrix.arch }}" --identity -

      - name: Verify standalone app
        run: >-
          python scripts/verify_distribution.py
          --app "dist/${{ matrix.arch }}/Meeting Memory.app"
          --arch "${{ matrix.arch }}"
          --signature adhoc

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-memory-${{ matrix.arch }}-adhoc
          path: dist/${{ matrix.arch }}/Meeting Memory.app
          if-no-files-found: error
          retention-days: 7
