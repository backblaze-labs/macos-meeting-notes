[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-memory"
version = "0.1.0"
description = "Personal macOS meeting transcription library with local markdown storage and B2 backup."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Pavez" }]
dependencies = [
  "anthropic>=0.40",
  "assemblyai>=0.35",
  "boto3>=1.35",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "keyring>=25.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "rumps>=0.4",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
meeting-memory = "meeting_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meeting_memory.service.assets" = ["*.icns"]
"meeting_memory.ui.assets" = ["*.png", "*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/meeting_memory/doctor.py" = ["UP036"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
